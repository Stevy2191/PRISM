name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend test suite
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: prism_test
          MARIADB_USER: prism
          MARIADB_PASSWORD: prismtestpw
          MARIADB_ROOT_PASSWORD: roottestpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      # config/config.js appends "_test" for the test environment, so the
      # migrations land in prism_test — the schema the suite runs against.
      DB_NAME: prism
      DB_USER: prism
      DB_PASSWORD: prismtestpw
      SESSION_SECRET: ci-session-secret-not-used-outside-continuous-integration
      ENCRYPTION_KEY: ci-encryption-key-not-used-outside-continuous-integration
      LDAP_ENABLED: 'false'
      COOKIE_SECURE: 'false'
      UPLOAD_DIR: /tmp/prism-test-uploads
      CLAMAV_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Apply migrations to the test schema
        working-directory: ./backend
        run: npm run test:migrate

      - name: Run tests
        working-directory: ./backend
        # .env.test is developer-local and not committed; CI supplies the same
        # values through the job environment above.
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  agent:
    # The PRISM agent (Go, sub-project 8). Windows runs the parts only it
    # has (the DPAPI key store, its SYSTEM-only ACL, the named pipe). macOS
    # runs the same steps in agent.yml's package job, before it builds the
    # package: hosted Macs are scarce, and asking for two per push left runs
    # cancelled waiting for one.
    name: Agent tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned (2026-11-11): ubuntu-latest moved to 26.04, whose
        # package mirrors failed mid-install; 24.04 is the agent's own target.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # The Linux tray's ticket window is WebKitGTK 4.1 (cgo); the shim in
      # packaging/linux/pkgconfig lets the web view library find it (8c).
      - name: GTK and WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/agent/packaging/linux/pkgconfig" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Both programs, as each platform builds them: with cgo on Linux
      # (WebKitGTK for the ticket window) and macOS (Cocoa, WKWebView).
      - name: Build
        run: go build ./cmd/...
