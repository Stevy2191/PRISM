<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c5853215c172bfe2d0c9d7a4bd04f8a4">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lg{display:flex;min-height:900px;background:var(--bg)}
.left{width:46%;flex:none;background:var(--surf);border-right:1px solid var(--bd);display:flex;flex-direction:column;justify-content:space-between;padding:44px 56px}
.left .brand{font-size:20px}
.left .logo{width:30px;height:30px;border-radius:8px}
.tl{font-size:30px;font-weight:650;letter-spacing:-0.015em;line-height:1.2;max-width:460px;margin:0}
.bul{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:12px}
.bul li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--tx2)}
.bul .ck{width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;flex:none}
.right{flex:1;display:flex;align-items:center;justify-content:center;padding:48px}
.form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.form .input{height:46px;font-size:15px}
.pw{position:relative}
.pw .ib{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.caps{font-size:12.5px;color:var(--warn-ink);font-weight:600;margin-top:2px}
.or{display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--bd)}
.app .sso{height:46px;justify-content:center;color:var(--tx)}
.foot{font-size:12.5px;color:var(--tx3);text-align:center;margin:4px 0 0}
.pair{display:flex;gap:40px;width:820px;height:844px}
.mtop{padding:24px 20px;background:var(--surf);border-bottom:1px solid var(--bd)}
.mtop .tl{font-size:19px;margin-top:14px}
.mbody{padding:28px 20px}
</style>
</helmet>
<div class="{{cls}}" style="background:transparent">
  <div class="pair">
    <div class="phone" style="background:var(--bg)">
      <div class="mtop"><div class="brand" style="font-size:18px"><span class="logo" style="width:26px;height:26px;border-radius:7px"></span>PRISM</div><p class="tl">Project &amp; Request Integrated Service Manager</p></div>
      <div class="mbody"><form class="form">
        <h1 style="font-size:26px">Sign in to PRISM</h1>
        <div class="field"><label for="u">Username or email</label><input id="u" class="input" autocomplete="username" placeholder="username or email address" value="dortiz"></div>
        <div class="field"><label for="p">Password</label><div class="pw"><input id="p" class="input" type="password" autocomplete="current-password" value="correct-horse"><button class="ib" type="button" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><p class="caps" style="margin:0">Caps Lock is on</p></div>
        <button class="btn primary" type="submit" style="height:46px;justify-content:center;font-size:15px">Sign in</button>
        <div class="or">or</div>
        <a href="#" class="btn sso">Microsoft Entra ID</a>
        <p class="foot">Secure session · enter your PRISM credentials</p>
      </form></div>
    </div>
    <div class="phone" style="background:var(--bg);justify-content:center;padding:20px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="brand" style="justify-content:center;font-size:18px"><span class="logo" style="width:26px;height:26px;border-radius:7px"></span>PRISM</div>
        <form class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px">
          <div><h2 style="font-size:18px;margin:0">Change password</h2></div>
          <div class="field"><label for="m-cur">Current password</label><input id="m-cur" class="input" type="password" autocomplete="current-password" style="height:44px" value="oldpassword"></div>
          <div class="field"><label for="m-np">New password</label><input id="m-np" class="input" type="password" autocomplete="new-password" style="height:44px"><p class="hint" style="margin:0">At least 8 characters.</p></div>
          <div class="field"><label for="m-cf">Confirm new password</label><input id="m-cf" class="input" type="password" autocomplete="new-password" style="height:44px"></div>
          <button class="btn primary" type="submit" style="justify-content:center;height:48px">Update password</button>
          <button type="button" style="border:0;background:transparent;color:var(--tx3);font:inherit;font-size:13px;height:40px">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme ?? 'light';
    return { cls: 'app t-' + t };
  }
}
</script>
</body>
</html>
