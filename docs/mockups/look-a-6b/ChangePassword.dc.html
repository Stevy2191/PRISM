<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set a new password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c5853215c172bfe2d0c9d7a4bd04f8a4">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cp{min-height:820px;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.box .brand{justify-content:center;font-size:20px}
.box .logo{width:28px;height:28px;border-radius:8px}
.box form{padding:24px;display:flex;flex-direction:column;gap:14px}
.box .input{height:44px}
.lnk{border:0;background:transparent;color:var(--tx3);font:inherit;font-size:13px}
</style>
</helmet>
<div class="{{cls}}">
  <div class="cp">
    <div class="box">
      <div class="brand"><span class="logo"></span>PRISM</div>
      <form class="card">
        <div><h2 style="font-size:19px;margin:0">Set a new password</h2><p class="sub" style="font-size:13.5px">Your account requires a password change before you can continue (priya.shah).</p></div>
        <div class="notice" style="background:var(--dang-bg);border-color:var(--dang-bd);padding:10px 12px;border-radius:8px;font-size:13px;color:var(--dang)">Passwords do not match</div>
        <div class="field"><label for="np">New password</label><input id="np" class="input" type="password" autocomplete="new-password" value="newpassword1"><p class="hint" style="margin:0">At least 8 characters.</p></div>
        <div class="field"><label for="cf">Confirm new password</label><input id="cf" class="input" type="password" autocomplete="new-password" value="newpassword"></div>
        <button class="btn primary" type="submit" style="justify-content:center;height:44px">Update password</button>
        <button class="lnk" type="button">Sign out</button>
      </form>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme ?? 'light';
    return { cls: 'app t-' + t };
  }
}
</script>
</body>
</html>
