# PRISM — DEVELOPMENT stack. Builds the frontend and backend from source.
#
# Use this when working on the code (no prebuilt images needed):
#   1. cp .env.example .env   # then fill in your values
#   2. docker compose -f docker-compose.dev.yml up -d --build
#
# For a normal production deployment from prebuilt images, use the default
# docker-compose.yml instead.
#
# The backend automatically waits for the database, runs migrations, and starts.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-prism}
      MARIADB_USER: ${DB_USER:-prism}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ClamAV virus scanner. The backend streams every uploaded and emailed file
  # to it (port 3310, internal network only) and refuses the file if it can't
  # be scanned. Needs ~1.2 GB RAM idle and ~2.4 GB during the daily signature
  # reload; the first start downloads signatures and takes a few minutes.
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    environment:
      # Match the 100 MB upload ceiling, and report (don't skip) bigger files.
      CLAMD_CONF_StreamMaxLength: 101M
      CLAMD_CONF_MaxFileSize: 101M
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_data:/var/lib/clamav

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      PORT: 3001
      # Deliberately NOT setting TRUST_PROXY here: unlike the production
      # stack, this file publishes the backend port below so it can be called
      # directly during development. Trusting X-Forwarded-For on a
      # directly-reachable backend would let anyone spoof their source IP past
      # the login rate limiter. The cost is that rate limits seen through
      # nginx are shared rather than per-client, which is fine for dev.
    volumes:
      - uploads_data:/uploads
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"

volumes:
  mariadb_data:
  uploads_data:
  clamav_data:
