# Plain HTTP, the default. When setup.sh made a test certificate (it is in
# /etc/nginx/certs), nginx/tls-on.sh swaps this for nginx/tls.conf at start.
# Behind another proxy that handles HTTPS (Nginx Proxy Manager, Caddy, a load
# balancer...), keep the X-Forwarded-Proto it sent instead of replacing it with
# this server's own "http": the backend issues a Secure session cookie only on
# a request it knows was HTTPS. Without a proxy in front, it's this server's
# scheme. A client that sends the header itself only changes its own cookie.
map $http_x_forwarded_proto $prism_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/prism/test-ca.conf;
    include /etc/nginx/prism/site.conf;
}
