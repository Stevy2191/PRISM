# The PRISM site, shared by the plain HTTP server (nginx.conf) and the HTTPS
# one (nginx/tls.conf). Included inside a server block.
root /usr/share/nginx/html;
index index.html;

# Max upload size must accommodate 25MB attachments (+ multipart overhead).
client_max_body_size 30m;

# Baseline hardening headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Proxy API calls to the backend service.
location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
}

# Install links (8d) carry an install key in the path: kept out of the
# access log. The page itself is the app's; its API answers as above.
location /api/v1/install/ {
    access_log off;
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
}
location /install/ {
    access_log off;
    try_files $uri /index.html;
}

# SPA fallback — serve index.html for client-side routes. No `$uri/`:
# the build has an assets/ folder, and `$uri/` turned a hard refresh of
# the /assets page into a 301 to /assets/ (then a 403).
location / {
    try_files $uri /index.html;
}

# The build's files live in /assets/, but so do the Assets pages (/assets,
# /assets/12, /assets/licenses/3, ...): only a name with an extension
# (index-abc123.js, a .woff2 font) is a file. Everything else falls through
# to the SPA fallback above, so a refresh on any Assets page loads the app.
#
# Cache those files aggressively (hashed filenames from Vite); a missing one
# is a 404, never the app. An add_header here replaces the server-level ones,
# so repeat them.
location ~ ^/assets/.+\.[A-Za-z0-9]+$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
