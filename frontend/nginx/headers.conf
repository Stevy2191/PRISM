# The hardening headers, on every response. Included at the server level
# (site.conf) and again in any location that has an add_header of its own,
# since that replaces the server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# The app runs only its own scripts (no inline ones: the theme is set by
# /theme-init.js). Styles may be inline (the editor and React style props).
# Images may come from anywhere over HTTPS (pictures in emailed tickets).
# frame-src 'self' lets the email-template preview show; nobody may frame PRISM.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
# Only on a request that came in over HTTPS (this server's, or the proxy in
# front of it, Cloudflare included): browsers then refuse plain HTTP to this
# host for a year. Empty, so not sent, over plain HTTP.
add_header Strict-Transport-Security $prism_hsts always;
