# HTTPS with the certificate setup.sh made (docker-compose.tls.yml mounts it
# at /etc/nginx/certs). nginx/tls-on.sh installs this file and fills in
# PRISM_HTTPS_PORT, the port on the host that maps to 443 here.

# This server terminates HTTPS itself, so the scheme is its own (see
# nginx.conf for the plain HTTP case, behind another proxy).
map $scheme $prism_forwarded_proto {
    default $scheme;
}

# Plain HTTP sends everything to HTTPS, except the test certificate authority:
# a computer that doesn't trust it yet can still fetch it.
server {
    listen 80;
    server_name _;
    include /etc/nginx/prism/test-ca.conf;
    location / {
        return 301 https://$host:PRISM_HTTPS_PORT$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    include /etc/nginx/prism/test-ca.conf;
    include /etc/nginx/prism/site.conf;
}
