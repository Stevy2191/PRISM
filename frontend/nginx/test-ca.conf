# The test certificate authority setup.sh made, for computers to trust. It's a
# public certificate (its private key never leaves the host). 404 when PRISM
# runs on a certificate of its own, so the Devices tab knows not to offer it.
location = /prism-test-ca.crt {
    root /etc/nginx/certs;
    try_files /prism-test-ca.crt =404;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="prism-test-ca.crt"' always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
