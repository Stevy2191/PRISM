# PRISM — default production stack. Pulls prebuilt images from GitHub Container
# Registry (no build step). This is the only file most deployments need:
#   1. cp .env.example .env   # then fill in your values
#   2. docker compose up -d
# To update later:  docker compose pull && docker compose up -d
#
# Which build you get is IMAGE_TAG in .env (default: latest). Set it to a
# version to pin or roll back (IMAGE_TAG=0.2.0), or to dev to track the dev
# branch. See RELEASING.md.
#
# Migrations run automatically on backend startup.
# Developers who want to build from source: use docker-compose.dev.yml instead
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-prism}
      MARIADB_USER: ${DB_USER:-prism}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/stevy2191/prism-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      PORT: 3001
      # The backend is reachable only through the frontend nginx service on
      # this network (no host port is published for it), and nginx sets
      # X-Forwarded-For. Trusting exactly one proxy hop lets rate limiting see
      # real client IPs. Do not raise this, and do not publish the backend
      # port: a directly-reachable backend that trusts X-Forwarded-For lets a
      # client forge its source IP and reset the login rate limiter at will.
      TRUST_PROXY: 1
    volumes:
      - uploads_data:/uploads

  frontend:
    image: ghcr.io/stevy2191/prism-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  mariadb_data:
  uploads_data:
